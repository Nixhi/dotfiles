# ~/.config/tmux/tmux.conf

## General

# -- GLOBAL -- #
set -g mouse on
set -g prefix M-z

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

## Binds

# -- PREFIX -- #
unbind -a -T prefix
bind M-z send-prefix

bind e detach-client
bind q kill-session

bind t new-window
bind y kill-window

bind n split-window -v
bind m split-window -h

bind x resize-pane -Z

# -- MASTER -- #
bind -n M-d next-window
bind -n M-a previous-window

bind -n M-w swap-pane -U
bind -n M-s swap-pane -D

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-u resize-pane -L
bind -n M-i resize-pane -D
bind -n M-o resize-pane -U
bind -n M-p resize-pane -R
