# /etc/mpd.conf

# Music dir
music_directory "~/Music"

# Data files
db_file            "~/.local/share/mpd/db"
log_file           "~/.local/share/mpd/log"
state_file         "~/.local/share/mpd/state"
sticker_file       "~/.local/share/mpd/sticker"
playlist_directory "~/.local/share/mpd/playlist"

# Connect
bind_to_address "127.0.0.1"
port            "6600"

# Buffer
audio_buffer_size "16384"
max_output_buffer_size "65536"

# Misc options
max_connections "5"
auto_update "yes"
replaygain "off"

# Output
audio_output {
    type "pipewire"
    name "PipeWire Output"
    runtime_priority "rt"
    always_on "yes"
}

audio_output {
    type "fifo"
    name "Channel Output"
    path "$XDG_RUNTIME_DIR/mpd"
}
